<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <filter id="card-shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0000000d"/>
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#00000008"/>
    </filter>
    <filter id="sidebar-shadow">
      <feDropShadow dx="2" dy="0" stdDeviation="6" flood-color="#00000010"/>
    </filter>
    <filter id="msg-shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#00000012"/>
    </filter>
  </defs>

  <!-- App background -->
  <rect width="1200" height="750" fill="#f9fafb"/>

  <!-- ── SIDEBAR ── -->
  <rect x="0" y="0" width="220" height="750" fill="white" filter="url(#sidebar-shadow)"/>
  <rect x="220" y="0" width="1" height="750" fill="#e5e7eb"/>

  <!-- Sidebar logo area -->
  <circle cx="36" cy="32" r="14" fill="#eef2ff"/>
  <rect x="30" y="24" width="5" height="16" rx="1.5" fill="#6366f1"/>
  <rect x="38" y="24" width="5" height="16" rx="1.5" fill="#818cf8"/>
  <rect x="30" y="21" width="13" height="5" rx="1.5" fill="#6366f1"/>
  <text x="58" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#111827">RAG Explorer</text>
  <line x1="16" y1="64" x2="204" y2="64" stroke="#f3f4f6" stroke-width="1"/>
  <text x="20" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">NAVIGATION</text>

  <!-- Nav: Dashboard -->
  <rect x="22" y="107" width="7" height="7" rx="1" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="31" y="107" width="7" height="7" rx="1" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="22" y="116" width="7" height="4" rx="1" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="31" y="116" width="7" height="4" rx="1" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="52" y="119" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#6b7280">Dashboard</text>

  <!-- Nav: Documents -->
  <rect x="22" y="143" width="9" height="11" rx="1" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="24" y1="148" x2="29" y2="148" stroke="#9ca3af" stroke-width="1"/>
  <line x1="24" y1="151" x2="29" y2="151" stroke="#9ca3af" stroke-width="1"/>
  <text x="52" y="153" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#6b7280">Documents</text>

  <!-- Nav: Chat (ACTIVE) -->
  <rect x="8" y="167" width="204" height="38" rx="8" fill="#eef2ff"/>
  <rect x="22" y="179" width="11" height="10" rx="2" fill="none" stroke="#6366f1" stroke-width="1.5"/>
  <path d="M24 189 l2 4 l2-4" fill="#eef2ff" stroke="#6366f1" stroke-width="1"/>
  <text x="52" y="191" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#6366f1">Chat</text>

  <!-- Nav: Settings -->
  <circle cx="27" cy="229" r="5" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <circle cx="27" cy="229" r="2" fill="#9ca3af"/>
  <text x="52" y="233" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#6b7280">Settings</text>

  <!-- Sidebar bottom user -->
  <line x1="16" y1="700" x2="204" y2="700" stroke="#f3f4f6" stroke-width="1"/>
  <circle cx="36" cy="724" r="14" fill="#eef2ff"/>
  <text x="36" y="729" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#6366f1" text-anchor="middle">A</text>
  <text x="58" y="720" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#111827">admin</text>
  <text x="58" y="734" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">Administrator</text>

  <!-- ── CONVERSATION LIST PANEL ── -->
  <rect x="221" y="0" width="220" height="750" fill="white"/>
  <rect x="441" y="0" width="1" height="750" fill="#e5e7eb"/>

  <!-- Conv panel header -->
  <rect x="221" y="0" width="220" height="64" fill="white"/>
  <text x="240" y="25" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#111827">Conversations</text>
  <line x1="221" y1="64" x2="441" y2="64" stroke="#e5e7eb" stroke-width="1"/>

  <!-- New Conversation Button -->
  <rect x="232" y="76" width="196" height="34" rx="8" fill="#6366f1"/>
  <text x="240" y="97" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="500" fill="white">+ New Conversation</text>

  <!-- Conv list label -->
  <text x="240" y="136" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">RECENT</text>

  <!-- Conv 1: Q3 Financial Analysis (ACTIVE) -->
  <rect x="232" y="144" width="196" height="58" rx="8" fill="#eef2ff"/>
  <rect x="232" y="144" width="3" height="58" rx="1.5" fill="#6366f1"/>
  <text x="248" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#6366f1">Q3 Financial Analysis</text>
  <text x="248" y="181" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#818cf8">What were the main revenue...</text>
  <text x="416" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#818cf8" text-anchor="end">Today</text>

  <!-- Conv 2: Product Requirements -->
  <rect x="232" y="212" width="196" height="58" rx="8" fill="white"/>
  <text x="248" y="232" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#374151">Product Requirements</text>
  <text x="248" y="249" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">What are the key features...</text>
  <text x="416" y="224" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af" text-anchor="end">Mar 16</text>

  <!-- Conv 3: Research Summary -->
  <rect x="232" y="280" width="196" height="58" rx="8" fill="white"/>
  <text x="248" y="300" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#374151">Research Summary</text>
  <text x="248" y="317" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af">Summarize the key findings...</text>
  <text x="416" y="292" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af" text-anchor="end">Mar 14</text>

  <!-- ── MAIN CHAT AREA ── -->
  <rect x="442" y="0" width="758" height="750" fill="#f9fafb"/>

  <!-- Chat header -->
  <rect x="442" y="0" width="758" height="64" fill="white"/>
  <line x1="442" y1="64" x2="1200" y2="64" stroke="#e5e7eb" stroke-width="1"/>
  <text x="466" y="32" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#111827">Q3 Financial Analysis</text>
  <text x="466" y="50" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#9ca3af">3 documents selected</text>
  <!-- Clear button -->
  <rect x="1110" y="18" width="70" height="28" rx="6" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <text x="1145" y="36" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Clear</text>

  <!-- ── DOCUMENT FILTER PILLS ── -->
  <rect x="442" y="64" width="758" height="52" fill="white"/>
  <line x1="442" y1="116" x2="1200" y2="116" stroke="#e5e7eb" stroke-width="1"/>
  <text x="466" y="87" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="#6b7280">Filter by document:</text>

  <!-- Pill 1: annual-report.pdf (selected/indigo) -->
  <rect x="568" y="74" width="148" height="26" rx="13" fill="#6366f1"/>
  <text x="642" y="91" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500" fill="white" text-anchor="middle">annual-report.pdf</text>
  <text x="706" y="91" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#a5b4fc">x</text>

  <!-- Pill 2: product-spec.md (unselected) -->
  <rect x="726" y="74" width="118" height="26" rx="13" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <text x="785" y="91" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">product-spec.md</text>

  <!-- Pill 3: research-paper.pdf (unselected) -->
  <rect x="854" y="74" width="138" height="26" rx="13" fill="white" stroke="#d1d5db" stroke-width="1"/>
  <text x="923" y="91" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">research-paper.pdf</text>

  <!-- ── CHAT MESSAGES AREA ── -->
  <!-- Scrollable chat area background -->
  <rect x="442" y="116" width="758" height="556" fill="#f9fafb"/>

  <!-- Date separator -->
  <text x="820" y="143" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#9ca3af" text-anchor="middle">Today, March 18, 2026</text>
  <line x1="460" y1="139" x2="750" y2="139" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="890" y1="139" x2="1170" y2="139" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ── USER MESSAGE (right-aligned) ── -->
  <rect x="952" y="156" width="220" height="50" rx="16" fill="#6366f1" filter="url(#msg-shadow)"/>
  <!-- round bottom left corner less -->
  <text x="1062" y="179" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="white" text-anchor="middle">What were the main revenue</text>
  <text x="1062" y="196" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="white" text-anchor="middle">drivers in Q3?</text>

  <!-- User avatar -->
  <circle cx="1188" cy="181" r="13" fill="#4f46e5"/>
  <text x="1188" y="186" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">A</text>
  <text x="1170" y="220" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af" text-anchor="end">10:24 AM</text>

  <!-- ── ASSISTANT MESSAGE (left-aligned) ── -->
  <!-- Bot avatar -->
  <circle cx="464" cy="245" r="13" fill="#eef2ff" stroke="#c7d2fe" stroke-width="1"/>
  <!-- Bot icon: small sparkle/AI indicator -->
  <text x="464" y="250" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#6366f1" text-anchor="middle">AI</text>

  <!-- Assistant message bubble -->
  <rect x="485" y="228" width="628" height="152" rx="16" fill="white" stroke="#e5e7eb" stroke-width="1" filter="url(#msg-shadow)"/>
  <text x="505" y="252" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#111827">Based on the Q3 financial report, the main revenue drivers were:</text>
  <!-- numbered list items -->
  <text x="505" y="274" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151">1) Cloud services grew 34% YoY reaching $2.4B, primarily driven by</text>
  <text x="520" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151">enterprise adoption and new platform offerings.</text>
  <text x="505" y="312" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151">2) Subscription revenue increased 28%, contributing $1.8B, supported by</text>
  <text x="520" y="328" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151">expanded customer base and higher retention rates.</text>
  <text x="505" y="350" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#374151">3) Professional services and consulting added $340M, up 18% from Q2.</text>
  <text x="505" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#9ca3af">10:24 AM</text>

  <!-- Show sources link -->
  <rect x="485" y="390" width="118" height="24" rx="12" fill="#eef2ff"/>
  <text x="494" y="406" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6366f1">Show sources (3)</text>
  <!-- chevron -->
  <path d="M596 400 l4 3 l4-3" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── SOURCE CARDS ── -->

  <!-- Source card 1 -->
  <rect x="485" y="424" width="616" height="72" rx="10" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="485" y="424" width="3" height="72" rx="1.5" fill="#6366f1"/>
  <!-- source header -->
  <text x="498" y="444" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6366f1">Source 1</text>
  <rect x="548" y="433" width="104" height="16" rx="4" fill="#f3f4f6"/>
  <text x="600" y="444" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#374151" text-anchor="middle">annual-report.pdf</text>
  <!-- score badge -->
  <rect x="820" y="433" width="68" height="16" rx="4" fill="#dcfce7"/>
  <text x="854" y="444" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#16a34a" text-anchor="middle">score: 0.94</text>
  <!-- excerpt text -->
  <text x="498" y="464" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">"Cloud services revenue reached $2.4 billion in Q3, representing a 34% year-over-year increase,</text>
  <text x="498" y="480" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">primarily driven by enterprise adoption..."</text>

  <!-- Source card 2 -->
  <rect x="485" y="506" width="616" height="72" rx="10" fill="white" stroke="#e5e7eb" stroke-width="1"/>
  <rect x="485" y="506" width="3" height="72" rx="1.5" fill="#818cf8"/>
  <text x="498" y="526" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6366f1">Source 2</text>
  <rect x="548" y="515" width="104" height="16" rx="4" fill="#f3f4f6"/>
  <text x="600" y="526" font-family="system-ui, -apple-system, sans-serif" font-size="10" fill="#374151" text-anchor="middle">annual-report.pdf</text>
  <rect x="820" y="515" width="68" height="16" rx="4" fill="#fef9c3"/>
  <text x="854" y="526" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#ca8a04" text-anchor="middle">score: 0.87</text>
  <text x="498" y="546" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">"Subscription-based revenue streams contributed $1.8 billion, marking a significant 28% increase</text>
  <text x="498" y="562" font-family="system-ui, -apple-system, sans-serif" font-size="11" fill="#6b7280">compared to the same period last year..."</text>

  <!-- ── INPUT AREA ── -->
  <rect x="442" y="672" width="758" height="78" fill="white" stroke="#e5e7eb" stroke-width="0"/>
  <line x1="442" y1="672" x2="1200" y2="672" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Text input box -->
  <rect x="458" y="686" width="648" height="48" rx="12" fill="white" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="458" y="686" width="648" height="48" rx="12" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
  <text x="480" y="715" font-family="system-ui, -apple-system, sans-serif" font-size="13" fill="#9ca3af">Ask a question... (Enter to send)</text>

  <!-- Send button -->
  <rect x="1116" y="686" width="72" height="48" rx="12" fill="#6366f1"/>
  <text x="1152" y="714" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Send</text>
  <!-- send arrow icon -->
  <path d="M1143 710 l8 4 l-8 4" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="1143" y1="714" x2="1153" y2="714" stroke="white" stroke-width="1.5" stroke-linecap="round"/>

</svg>
