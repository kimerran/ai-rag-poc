  <path d="M686 131 q0-12 14-12 q2-10 12-10 q12 0 12 12 q8 1 8 10 q0 8-8 8 l-38 0 q-8 0-8-8" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linejoin="round"/>
  <line x1="710" y1="149" x2="710" y2="163" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3 2"/>
  <path d="M705 154 l5-6 l5 6" fill="none" stroke="#9ca3af" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

