  <text x="36" y="729" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#6366f1" text-anchor="middle">A</text>
  <text x="58" y="720" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#111827">admin</text>
