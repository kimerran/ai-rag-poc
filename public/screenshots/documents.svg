<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750">
  <defs>
    <filter id="card-shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0000000d"/>
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#00000008"/>
