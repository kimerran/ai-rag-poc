  <rect x="38" y="24" width="5" height="16" rx="1.5" fill="#818cf8"/>
  <rect x="30" y="21" width="13" height="5" rx="1.5" fill="#6366f1"/>
  <text x="58" y="37" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#111827">RAG Explorer</text>

  <line x1="16" y1="64" x2="204" y2="64" stroke="#f3f4f6" stroke-width="1"/>
  <text x="20" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" fill="#9ca3af" letter-spacing="0.08em">NAVIGATION</text>

  <!-- Nav: Dashboard -->
  <rect x="22" y="107" width="7" height="7" rx="1" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="31" y="107" width="7" height="7" rx="1" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="22" y="116" width="7" height="4" rx="1" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="31" y="116" width="7" height="4" rx="1" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="52" y="119" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#6b7280">Dashboard</text>

  <!-- Nav: Documents (ACTIVE) -->
