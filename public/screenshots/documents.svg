  <rect x="22" y="145" width="9" height="11" rx="1" fill="none" stroke="#6366f1" stroke-width="1.5"/>
  <line x1="24" y1="150" x2="29" y2="150" stroke="#6366f1" stroke-width="1"/>
  <line x1="24" y1="153" x2="29" y2="153" stroke="#6366f1" stroke-width="1"/>
